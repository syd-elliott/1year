<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Custom Wordle Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Container for heart flood animation -->
    <div id="heart-container"></div>

    <div id="game-container">
        <h1 id="game-title">
            <span class="title-main">WORDLE</span>
            <span class="title-edition">🛒 & 🦑 EDITION</span>
        </h1>

      <!-- Main Play View -->
      <div id="play-view" class="view-section">
        <div id="board"></div>
        <div id="message-container"></div>
        <div id="keyboard"></div>
      </div>

      <!-- Win Screen -->
      
    <div id="win-screen" class="end-screen view-section hidden">

        <p class="win-kicker">✦ ONE YEAR ✦</p>
    
        <h2 class="win-heading">Happy One Year! 💚</h2>
    
        <p class="win-subheading">
        The best moments from the best year 💜
        </p>
    
        <div class="win-divider">
        <span>♥</span>
        </div>
    
        <div id="photo-gallery">
        <p class="photo-placeholder">Your custom photos will appear here!</p>
        </div>
    
        <p class="win-footer">
        Here's to many more memories (and Wordles) together.
        </p>
    
        <button class="btn restart-btn">Play Again ↻</button>
    
    </div>
  

      <!-- Lose Screen -->
      <div id="lose-screen" class="end-screen hidden">
          <h2>Not quite! Try again? </h2>
          <button class="btn restart-btn">Try Again</button>
      </div>

    <script src="script.js"></script>
  </body>
</html>
