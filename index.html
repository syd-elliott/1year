<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Custom Wordle Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Container for heart flood animation -->
    <div id="heart-container"></div>

    <div id="game-container">
      <h1>Wordle (2026 💚💜 edition)</h1>

      <!-- Main Play View -->
      <div id="play-view">
        <div id="board"></div>
        <div id="message-container"></div>
        <div id="keyboard"></div>
      </div>

      <!-- Win Screen -->
      <div id="win-screen" class="end-screen hidden">
        <h2>🎉 Congratulations! 🎉</h2>
        <p>You guessed the word correctly!</p>

        <div id="photo-gallery">
          <p class="photo-placeholder">Your custom photos will appear here!</p>
        </div>

        <button class="btn restart-btn">Play Again</button>
      </div>

      <!-- Lose Screen -->
      <div id="lose-screen" class="end-screen hidden">
        <h2>Game Over</h2>
        <p>The word was: <strong id="target-word"></strong></p>
        <button class="btn restart-btn">Try Again</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
